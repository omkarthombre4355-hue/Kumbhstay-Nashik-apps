name: KumbhStay Apps - Professional Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: kumbhstay-apps
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"

jobs:

  company:
    name: KumbhStay Company
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Check Project
        run: |
          test -f KumbhStay-Company/gradlew
          test -d KumbhStay-Company/app

      - name: Build Company APK
        working-directory: KumbhStay-Company
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Upload Company APK
        uses: actions/upload-artifact@v4
        with:
          name: KumbhStay-Company-APK
          path: KumbhStay-Company/app/build/outputs/apk/debug/app-debug.apk


  customer:
    name: KumbhStay Customer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Check Project
        run: |
          test -f KumbhStay-Customer/gradlew
          test -d KumbhStay-Customer/app

      - name: Build Customer APK
        working-directory: KumbhStay-Customer
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Upload Customer APK
        uses: actions/upload-artifact@v4
        with:
          name: KumbhStay-Customer-APK
          path: KumbhStay-Customer/app/build/outputs/apk/debug/app-debug.apk


  hotel-owner:
    name: KumbhStay Hotel Owner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Check Project
        run: |
          test -f KumbhStay-HotelOwner/gradlew
          test -d KumbhStay-HotelOwner/app

      - name: Build Hotel Owner APK
        working-directory: KumbhStay-HotelOwner
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Upload Hotel Owner APK
        uses: actions/upload-artifact@v4
        with:
          name: KumbhStay-HotelOwner-APK
          path: KumbhStay-HotelOwner/app/build/outputs/apk/debug/app-debug.apkname: KumbhStay Apps - Professional Build

