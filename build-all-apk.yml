name: KumbhStay Android Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Company
            folder: KumbhStay-Company
            artifact: KumbhStay-Company-APK

          - name: Customer
            folder: KumbhStay-Customer
            artifact: KumbhStay-Customer-APK

          - name: Hotel Owner
            folder: KumbhStay-HotelOwner
            artifact: KumbhStay-HotelOwner-APK

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Check Android project
        run: |
          test -f "${{ matrix.folder }}/gradlew"
          test -d "${{ matrix.folder }}/app"

      - name: Build APK
        working-directory: ${{ matrix.folder }}
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.folder }}/app/build/outputs/apk/debug/app-debug.apk
